# Render blueprint for the web service. The database is external: set DATABASE_URL to any
# Postgres connection string (for example Neon), with sslmode=require if the provider needs it.
#
# A free web service sleeps when idle, and while it sleeps no schedule fires and the Telegram
# bot is not heard. Run this on a paid, always-on instance.
services:
  - type: web
    name: accred-automation
    runtime: node
    plan: starter
    region: singapore
    # Dev dependencies are needed to build (TypeScript, Tailwind) and to run migrations (drizzle-kit).
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: APP_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Add these in the dashboard (Environment tab) when ready:
      #   APP_URL                 once a custom domain is attached, e.g. https://automation.accred.sh
      #   TELEGRAM_BOT_TOKEN      shared bot for one-click Telegram linking
      #   GOOGLE_CLIENT_ID        Gmail connection
      #   GOOGLE_CLIENT_SECRET    Gmail connection
